<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>3D Coordinate Marker Editor</title>
    <style>
        html, body, canvas {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #panel {
            position: absolute;
            right: 0;
            top: 0;
            width: 220px;
            height: 100%;
            background: rgba(0,0,0,0.75);
            color: white;
            font-family: sans-serif;
            font-size: 13px;
            padding: 10px;
            overflow-y: auto;
        }

        .point-entry {
            cursor: pointer;
            margin: 6px 0;
        }

        .selected {
            color: #00ffff;
            font-weight: bold;
        }

        #fitBtn {
            margin-top: 10px;
            width: 100%;
            padding: 6px;
            font-weight: bold;
            background: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

            #fitBtn:hover {
                background: #555;
            }
    </style>
</head>
<body>
    <div id="panel">
        <b>📌 Placed Points:</b>
        <div id="pointList"></div>
        <button id="fitBtn">🔍 Fit to View</button>
    </div>
    <canvas id="renderCanvas"></canvas>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
    <script src="https://cdn.babylonjs.com/materialsLibrary/babylon.gridMaterial.min.js"></script>

    <script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);
    const scene = new BABYLON.Scene(engine);

    const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI/2, Math.PI/2.5, 10, BABYLON.Vector3.Zero(), scene);
    camera.attachControl(canvas, true);
    new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);

    // Grid and axes
    const grid = BABYLON.MeshBuilder.CreateGround("ground", { width: 30, height: 30 }, scene);
    const gridMat = new BABYLON.GridMaterial("grid", scene);
    gridMat.gridRatio = 1;
    grid.material = gridMat;
    new BABYLON.AxesViewer(scene, 2);

    // GUI and point data
    const gui = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("UI");
    const pointListDiv = document.getElementById("pointList");
    const fitBtn = document.getElementById("fitBtn");

    const pointMarkers = [];
    const pointLabels = [];
    const calloutLines = [];

    let selectedMarker = null;
    let pointId = 1;

    // Load model (assumed centered)
    BABYLON.SceneLoader.Append("./", "model.glb", scene, () => {
      console.log("✅ Model loaded.");
    });

    // Add marker logic
    const addPoint = (position) => {
      const id = pointId++;
      const marker = BABYLON.MeshBuilder.CreateSphere("marker" + id, { diameter: 0.15 }, scene);
      marker.position = position.clone();
      marker.metadata = { id };

      marker.material = new BABYLON.StandardMaterial("mat", scene);
      marker.material.diffuseColor = new BABYLON.Color3(1, 0.6, 0);

      // GUI label
      const label = new BABYLON.GUI.Rectangle("label" + id);
      label.background = "#222";
      label.height = "28px";
      label.width = "160px";
      label.cornerRadius = 4;
      label.thickness = 0;
      label.alpha = 0.9;
      gui.addControl(label);
      label.linkWithMesh(marker);
      label.linkOffsetY = -40;

      const text = new BABYLON.GUI.TextBlock();
      text.text = `#${id} [${position.x.toFixed(2)}, ${position.y.toFixed(2)}, ${position.z.toFixed(2)}]`;
      text.color = "white";
      text.fontSize = 12;
      label.addControl(text);

      // Callout line
      const callout = BABYLON.MeshBuilder.CreateLines("line" + id, {
        points: [marker.position, marker.position.add(new BABYLON.Vector3(0, 0.35, 0))]
      }, scene);
      callout.color = new BABYLON.Color3(1, 1, 1);

      // List entry
      const entry = document.createElement("div");
      entry.className = "point-entry";
      entry.textContent = `#${id} → [${position.x.toFixed(2)}, ${position.y.toFixed(2)}, ${position.z.toFixed(2)}]`;
      entry.onclick = () => selectPoint(marker);
      pointListDiv.appendChild(entry);

      marker.metadata.labelUI = label;
      marker.metadata.lineMesh = callout;
      marker.metadata.domElement = entry;

      pointMarkers.push(marker);
      pointLabels.push(label);
      calloutLines.push(callout);
    };

    // Selection handler
    const selectPoint = (marker) => {
      if (selectedMarker) {
        selectedMarker.material.diffuseColor = new BABYLON.Color3(1, 0.6, 0);
        selectedMarker.metadata.domElement.classList.remove("selected");
      }
      selectedMarker = marker;
      marker.material.diffuseColor = new BABYLON.Color3(0.2, 1, 1);
      marker.metadata.domElement.classList.add("selected");
    };

    // Handle Ctrl + LMB clicks
    scene.onPointerObservable.add((pointerInfo) => {
      if (pointerInfo.type === BABYLON.PointerEventTypes.POINTERDOWN) {
        const e = pointerInfo.event;
        if (e.button !== 0 || !e.ctrlKey) return;

        const pick = scene.pick(e.clientX, e.clientY);
        if (pick?.hit && pick.pickedPoint) {
          addPoint(pick.pickedPoint);
        }
      }
    });

    // Fit-to-view logic
    fitBtn.onclick = () => {
      const meshes = scene.meshes.filter(m => m.name !== "ground");
      const bb = BABYLON.Mesh.MergeMeshes(meshes, true, false, undefined, false, true);
      if (bb) {
        const ext = bb.getBoundingInfo().boundingBox.extendSizeWorld.length();
        camera.setTarget(bb.getBoundingInfo().boundingBox.centerWorld);
        camera.radius = ext * 2.2;
        bb.dispose();
      }
    };

    engine.runRenderLoop(() => scene.render());
    window.addEventListener("resize", () => engine.resize());
    </script>
</body>
</html>
