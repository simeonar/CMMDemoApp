<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Mitutoyo Viewer</title>
    <style>
        html, body, canvas {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>

    <!-- Babylon.js и glTF загрузчик -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylon.glTF2FileLoader.min.js"></script>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);

            // Создаем окружение и камеру в стиле "вьювера"
            const environment = scene.createDefaultEnvironment({
                createSkybox: true,
                createGround: false, // Отключаем плоскость земли
                skyboxSize: 1,
                groundSize: 1
            });

            // Удаляем стандартный свет, чтобы добавить свой
            if (scene.lights.length > 0) {
                scene.lights[0].dispose();
            }

            // Добавляем два направленных источника света
            // Свет 1: снизу-спереди-справа
            const light1 = new BABYLON.DirectionalLight("dir01", new BABYLON.Vector3(-0.5, -1, -0.5), scene);
            light1.position = new BABYLON.Vector3(20, 40, 20);
            light1.intensity = 10;

            // Свет 2: снизу-спереди-слева
            const light2 = new BABYLON.DirectionalLight("dir02", new BABYLON.Vector3(0.5, -1, -0.5), scene);
            light2.position = new BABYLON.Vector3(-20, 40, -20);
            light2.intensity = 10;


            scene.createDefaultCameraOrLight(true, true, true);

            // Настраиваем камеру для лучшего взаимодействия
            const camera = scene.activeCamera;
            if (camera instanceof BABYLON.ArcRotateCamera) {
                camera.wheelPrecision = 50; // Регулирует чувствительность колеса мыши
                camera.allowUpsideDown = false; // Запрещает камере переворачиваться
            }

            // Загрузка модели
            BABYLON.SceneLoader.ImportMesh(
                "", "models/", "mitutoyo.gltf", scene,
                function (meshes) {
                    // 1. Создаем корневой узел для всей модели
                    const modelRoot = new BABYLON.TransformNode("modelRoot", scene);
                    meshes.forEach(mesh => {
                        if (mesh) mesh.parent = modelRoot;
                    });

                    // 2. Исправляем начальную ориентацию
                    modelRoot.rotation.x = Math.PI;
                    modelRoot.computeWorldMatrix(true); // Применяем поворот

                    // 3. Вычисляем центр и размер для кадрирования
                    const bounds = modelRoot.getHierarchyBoundingVectors(true);
                    const center = bounds.min.add(bounds.max).scale(0.5);
                    const size = bounds.max.subtract(bounds.min).length();

                    // 4. Создаем pivot в центре модели
                    const pivot = new BABYLON.TransformNode("pivot", scene);
                    pivot.position = center;
                    modelRoot.parent = pivot;
                    modelRoot.position.subtractInPlace(center);

                    // Устанавливаем начальный поворот, чтобы модель была "лицом" к камере
                    pivot.rotation.y = Math.PI / 2; // Поворот на 90 градусов

                    // 5. Настраиваем камеру вручную
                    if (camera instanceof BABYLON.ArcRotateCamera) {
                        // Устанавливаем цель на pivot
                        camera.setTarget(pivot.position);

                        // Рассчитываем и устанавливаем дистанцию с запасом
                        camera.radius = size * 2;
                    }

                    // 6. Анимация вращения pivot
                    scene.onBeforeRenderObservable.add(() => {
                        pivot.rotation.y -= 0.003; // Изменено направление вращения
                    });
                },
                null,
                function (scene, message) {
                    console.error("Ошибка при загрузке модели:", message);
                }
            );

            return scene;
        };

        const scene = createScene();

        engine.runRenderLoop(() => scene.render());
        window.addEventListener("resize", () => engine.resize());
    </script>
</body>
</html>
